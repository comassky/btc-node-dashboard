name: Release - Create and Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version X.Y.Z (without -SNAPSHOT)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    steps:
      - name: Compute versions
        id: version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Version must be X.Y.Z, got '$VERSION'"
            exit 1
          fi
          IFS='.' read -r major minor patch <<< "$VERSION"
          {
            echo "release=$VERSION"
            echo "tag=$VERSION"
            echo "next=${major}.${minor}.$((patch + 1))-SNAPSHOT"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Fail if tag already exists
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Cache frontend toolchain
        uses: actions/cache@v6
        with:
          path: src/main/web/node
          key: frontend-node-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pom.xml') }}

      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Prepare release version locally
        env:
          RELEASE: ${{ steps.version.outputs.release }}
        run: mvn -B -q versions:set -DnewVersion="$RELEASE" -DgenerateBackupPoms=false

      - name: Build and verify native runner
        run: mvn -B --no-transfer-progress verify -Dnative -Dquarkus.native.container-build=true -Dquarkus.native.native-image-xmx=6g

      - name: Build release Docker image locally
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE: ${{ steps.version.outputs.release }}
        run: |
          name="ghcr.io/${REPOSITORY,,}"
          docker build --platform linux/amd64 -f Dockerfile.native -t "$name:$RELEASE" -t "$name:latest" .
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload released OpenAPI schema
        uses: actions/upload-artifact@v7
        with:
          name: release-openapi
          path: |
            openapi.yaml
            openapi.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Commit verified release and create tag
        env:
          RELEASE: ${{ steps.version.outputs.release }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git add pom.xml src/main/web/package.json src/main/web/package-lock.json openapi.yaml openapi.json
          git diff --cached --quiet || git commit -m "Release $RELEASE"
          git tag -a "$TAG" -m "Release $RELEASE"

      - name: Set next development version
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          mvn -B -q versions:set -DnewVersion="$NEXT" -DgenerateBackupPoms=false
          node_version=$(mvn -B -q help:evaluate -Dexpression=quarkus.quinoa.package-manager-install.node-version -DforceStdout)
          node_dir="$PWD/.quinoa/node-${node_version}-npm/node"
          "$node_dir/node" "$node_dir/node_modules/npm/bin/npm-cli.js" --prefix src/main/web version "$NEXT" --no-git-tag-version --allow-same-version
          git add pom.xml src/main/web/package.json src/main/web/package-lock.json
          git commit -m "Prepare next development iteration $NEXT"

      - name: Push branch and tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: git push --atomic origin HEAD:main "refs/tags/$TAG"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified Docker image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          RELEASE: ${{ steps.version.outputs.release }}
        run: |
          docker push "$IMAGE:$RELEASE"
          docker push "$IMAGE:latest"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          prerelease: false

  openapi:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download released OpenAPI schema
        uses: actions/download-artifact@v8
        with:
          name: release-openapi
          path: site

      - name: Assemble Pages site
        run: |
          test -s site/openapi.yaml
          test -s site/openapi.json
          cat > site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8"/>
            <meta name="viewport" content="width=device-width, initial-scale=1"/>
            <title>Bitcoin Node Dashboard API</title>
            <style>body { margin: 0; padding: 0; }</style>
          </head>
          <body>
            <redoc spec-url="openapi.yaml"></redoc>
            <script src="https://cdn.redoc.ly/redoc/latest/bundles/redoc.standalone.js"></script>
          </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5