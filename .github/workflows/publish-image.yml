name: Release - Publish Tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release, e.g. 1.5.1'
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: 'Existing tag to build and release, e.g. 1.5.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-image-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    steps:
      - name: Resolve version
        id: version
        shell: bash
        env:
          RAW: ${{ inputs.tag }}
        run: |
          if [[ ! "$RAW" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Expected a semver tag X.Y.Z, got '$RAW'"
            exit 1
          fi
          echo "version=$RAW" >> "$GITHUB_OUTPUT"
          case "$RAW" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.version.outputs.version }}
          persist-credentials: false

      - name: Image tags
        id: tags
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          name="ghcr.io/${REPOSITORY,,}"
          tags="$name:$VERSION"
          if [[ "$PRERELEASE" == "false" ]]; then
            tags="$tags"$'\n'"$name:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Cache frontend toolchain
        uses: actions/cache@v6
        with:
          path: src/main/web/node
          key: frontend-node-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pom.xml') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build native runner (tests, frontend, native compile)
        run: mvn -B --no-transfer-progress verify -Dnative -Dquarkus.native.container-build=true -Dquarkus.native.native-image-xmx=6g

      - name: Upload released OpenAPI schema
        uses: actions/upload-artifact@v7
        with:
          name: release-openapi
          path: |
            openapi.yaml
            openapi.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the native image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.native
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false
          sbom: false

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}